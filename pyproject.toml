[project]
name = "reels-vault"
version = "0.1.0"
description = "Download, transcribe, and index Instagram reels into an Obsidian vault"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0",
    "gallery-dl>=1.27",
    "requests>=2.32",
    "yt-dlp>=2024.1",
]

[project.scripts]
reels-collect = "reels_vault.collect:main"
reels-digest = "reels_vault.digest:main"
reels-publish = "reels_vault.publish:main"
reels-graph = "reels_vault.graph:main"
reels-telegram = "reels_vault.telegram:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reels_vault"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "ruff>=0.4",
    "types-requests>=2.32",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
