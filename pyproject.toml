[project]
name = "reels-vault"
version = "0.1.0"
description = "Download, transcribe, enrich, and publish Instagram reels into a Postgres database"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29",
    "faster-whisper>=1.0",
    "gallery-dl>=1.27",
    "requests>=2.32",
    "yt-dlp>=2024.1",
]

[project.scripts]
reels-pipeline = "reels_pipeline.cli:main"
reels-telegram = "reels_pipeline.telegram:main"
reels-collections = "reels_pipeline.list_collections:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reels_pipeline"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "ruff>=0.4",
    "types-requests>=2.32",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/backoffice", "src/collections-studio"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
