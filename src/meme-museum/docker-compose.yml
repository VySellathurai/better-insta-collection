services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meme_museum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-meme_museum}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - meme_museum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meme_museum} -d ${POSTGRES_DB:-meme_museum}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  meme_museum_pgdata:
